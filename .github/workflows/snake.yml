name: Generate Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: francilenegs1996

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FF79C6&color_dots=#282A36,#44475A,#6272A4,#BD93F9,#50FA7B

      - name: Push generated SVG
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
